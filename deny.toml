# cargo-deny 0.20.2 (pinned in .github/workflows/ci.yml): `scripts/cargo-docker.sh target/tools/cargo-deny check`.
# Release targets: Linux and Windows (add-windows-port); macOS will add its triple here.
[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = false

[advisories]
# The RustSec database is fetched at check time (network in CI only).
yanked = "deny"
ignore = [
    # rsa (via russh, ssh-key, picky/sspi for RDP NLA): Marvin timing side channel in RSA decryption,
    # no patched release exists. rustXterm is a client: it signs with local RSA keys and encrypts to
    # servers; it never decrypts attacker-supplied RSA ciphertext as a network oracle. Revisit when
    # RustCrypto/RSA#626 ships.
    { id = "RUSTSEC-2023-0071", reason = "no fix upstream; client-side use only, no decryption oracle" },
]

[licenses]
# Permissive licenses found in the dependency graph (`cargo deny list`). No copyleft (GPL/LGPL);
# dual-licensed crates (e.g. self_cell, r-efi) are accepted through their permissive alternative.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
    # clipboard-win and error-code (arboard on Windows).
    "BSL-1.0",
    # egui's bundled default fonts (epaint_default_fonts).
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates and the vendored patches are publish = false or path dependencies.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
