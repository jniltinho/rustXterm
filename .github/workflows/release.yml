# The only workflow that builds and publishes binaries: runs on version tags (v0.1.0, v0.2.0-rc.1).
# Checks (fmt, clippy, tests, lab, deny, distro matrix) run in ci.yml on main; tag a commit whose CI is green.
name: release
on:
  push:
    tags: ['v*.*.*']
  # Dry run on any branch: every build, check, receipt and signing step, but nothing is published.
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read # the green-CI gate reads ci.yml runs
    steps:
      - name: Free runner disk space (preinstalled SDKs we never use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af >/dev/null
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the guard scans the full history
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --json conclusion -q '.[0].conclusion')
          if [ "$conclusion" != success ]; then
            echo "no successful ci.yml run for $GITHUB_SHA; release only commits whose CI is green" >&2
            exit 1
          fi
      - name: Tag matches the workspace version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          workspace=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && version=$workspace
          if [ "$version" != "$workspace" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $workspace" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Toolchain images (published, pinned by digest; no apt download in a release)
        run: |
          set -eu
          pull() { docker pull -q "docker.io/jniltinho/rustxterm-$1:snapshot-20261001@$2" >/dev/null
                   docker tag "docker.io/jniltinho/rustxterm-$1:snapshot-20261001@$2" "rustxterm-$1:dev"; }
          pull toolchain sha256:6872535a844a568c5fe8bf05c52c7a0adfa2370fce8990be511ff056ffdb9c70
          pull windows-toolchain sha256:7b9892dc2cc56819f4ee1002a2eb7381b31cebcff9166716b02e9cbd2ebbb5e0
          docker image ls 'rustxterm-*'
      - name: Source date (committer time; the receipt's source commit for a receipt-only commit)
        id: date
        run: |
          src=$(sed -n 's/^- Source commit: .\([0-9a-f]*\).$/\1/p' docs/gates/windows.md | head -n 1)
          if [ -z "$src" ] || ! git merge-base --is-ancestor "$src" HEAD 2>/dev/null \
            || [ -n "$(git diff --name-only "$src" HEAD -- . ':!docs/gates/windows.md')" ]; then
            src=HEAD
          fi
          echo "epoch=$(git log -1 --format=%ct "$src")" >> "$GITHUB_OUTPUT"
      - name: Build release artifacts (Linux and Windows, unsigned)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dist
          # Tool stages come from the published images (pinned by digest), so a release never
          # depends on the Ubuntu snapshot mirror; the source stages are always built here.
          build-contexts: |
            toolchain=docker-image://docker.io/jniltinho/rustxterm-toolchain:snapshot-20261001@sha256:6872535a844a568c5fe8bf05c52c7a0adfa2370fce8990be511ff056ffdb9c70
            windows-toolchain=docker-image://docker.io/jniltinho/rustxterm-windows-toolchain:snapshot-20261001@sha256:7b9892dc2cc56819f4ee1002a2eb7381b31cebcff9166716b02e9cbd2ebbb5e0
            appimage-tools=docker-image://docker.io/jniltinho/rustxterm-appimage-tools:snapshot-20261001@sha256:14cb82d3399e2d2790fd93e2f35f16036a9fd720805ecdc51e7c530d8c8467c0
          build-args: |
            RXT_VERSION=${{ steps.version.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.date.outputs.epoch }}
          outputs: type=local,dest=dist
          cache-from: |
            type=gha,scope=toolchain
            type=gha,scope=windows-toolchain
            type=registry,ref=docker.io/jniltinho/rustxterm-toolchain:snapshot-20261001
            type=registry,ref=docker.io/jniltinho/rustxterm-windows-toolchain:snapshot-20261001
            type=registry,ref=docker.io/jniltinho/rustxterm-appimage-tools:snapshot-20261001
      # The rebuild below ignores the cache, so drop it: two Linux+Windows builds overflow the runner disk.
      - name: Drop the build cache
        run: docker buildx prune -af >/dev/null && df -h /
      - name: Second clean build for the reproducibility check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dist
          # Tool stages come from the published images (pinned by digest), so a release never
          # depends on the Ubuntu snapshot mirror; the source stages are always built here.
          build-contexts: |
            toolchain=docker-image://docker.io/jniltinho/rustxterm-toolchain:snapshot-20261001@sha256:6872535a844a568c5fe8bf05c52c7a0adfa2370fce8990be511ff056ffdb9c70
            windows-toolchain=docker-image://docker.io/jniltinho/rustxterm-windows-toolchain:snapshot-20261001@sha256:7b9892dc2cc56819f4ee1002a2eb7381b31cebcff9166716b02e9cbd2ebbb5e0
            appimage-tools=docker-image://docker.io/jniltinho/rustxterm-appimage-tools:snapshot-20261001@sha256:14cb82d3399e2d2790fd93e2f35f16036a9fd720805ecdc51e7c530d8c8467c0
          # Recompile everything from source; the tool stages (apt, Rust toolchain, mingw, AppImage
          # tools) come from the published build cache so the rebuild does not depend on the Ubuntu
          # snapshot mirror being fast.
          no-cache-filters: source,fetch,build,metadata,appimage,dist-windows,checksums
          cache-from: |
            type=registry,ref=docker.io/jniltinho/rustxterm-toolchain:snapshot-20261001
            type=registry,ref=docker.io/jniltinho/rustxterm-windows-toolchain:snapshot-20261001
            type=registry,ref=docker.io/jniltinho/rustxterm-appimage-tools:snapshot-20261001
          build-args: |
            RXT_VERSION=${{ steps.version.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.date.outputs.epoch }}
          outputs: type=local,dest=dist-rebuild
      - name: dist-check (allowlists, PE headers, self-test, guard, byte-identical rebuild)
        run: RXT_TOOLCHAIN_STAGE=windows-toolchain scripts/cargo-docker.sh cargo xtask dist-check dist --reproduce dist-rebuild
      # The Windows artifacts always ship; a passing receipt (docs/gates/windows.md) bound to this
      # commit and to these unsigned bytes only changes the release note.
      - name: Windows receipt
        id: receipt
        run: |
          if RXT_TOOLCHAIN_STAGE=windows-toolchain scripts/cargo-docker.sh cargo xtask windows-receipt --check dist; then
            echo "windows=yes" >> "$GITHUB_OUTPUT"
          else
            echo "windows=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign the Windows artifacts (when the signing secret exists)
        id: sign
        env:
          PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.date.outputs.epoch }}
        run: |
          if [ -z "$PFX" ]; then echo "signed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p target/signing
          printf '%s' "$PFX" | base64 -d > target/signing/key.pfx
          printf '%s' "$PFX_PASSWORD" > target/signing/password
          RXT_TOOLCHAIN_STAGE=windows-toolchain scripts/cargo-docker.sh env \
            WINDOWS_SIGNING_PFX=target/signing/key.pfx WINDOWS_SIGNING_PASSWORD_FILE=target/signing/password \
            WINDOWS_SIGNING_TIMESTAMP_URL=http://timestamp.digicert.com SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            sh packaging/windows/sign.sh dist "$VERSION"
          rm -rf target/signing
          echo "signed=yes" >> "$GITHUB_OUTPUT"
      - name: Guard the final artifacts and write SHA256SUMS last
        run: |
          set -- --ci
          for f in dist/*.tar.gz dist/*.AppImage dist/*.zip dist/*.msi; do [ -e "$f" ] && set -- "$@" --artifact "$f"; done
          RXT_TOOLCHAIN_STAGE=windows-toolchain scripts/cargo-docker.sh cargo xtask guard "$@"
          (cd dist && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS)
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          WINDOWS: ${{ steps.receipt.outputs.windows }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          if [ "$SIGNED" = yes ]; then
            notes="The Windows executables and MSI are Authenticode-signed."
          else
            notes="The Windows zip, executables and MSI are unsigned: Windows SmartScreen may show an \"unrecognized app\" prompt. Verify the download against SHA256SUMS first."
          fi
          if [ "$WINDOWS" != yes ]; then
            notes="$notes Windows packages are a preview: the Windows end-to-end receipt (docs/gates/windows.md) does not cover this commit."
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --notes "$notes" \
            --title "rustXterm $VERSION" $prerelease
