[package]
name = "rxt-ui"
description = "egui shell: layout, tabs, sidebar, dialogs, terminal and file widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rxt-core.workspace = true
rxt-platform.workspace = true
rxt-term.workspace = true
rxt-engine.workspace = true
rxt-store.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
image.workspace = true
tracing.workspace = true
serde.workspace = true
secrecy.workspace = true
zeroize.workspace = true

# macOS compiles in eframe's glow renderer (the Metal fallback), which changes the `App::on_exit`
# signature; enable the feature here too so this crate builds on its own, not only via the app.
[target.'cfg(target_os = "macos")'.dependencies]
eframe = { workspace = true, features = ["glow"] }

[lints]
workspace = true
[dev-dependencies]
egui_kittest.workspace = true
serde_json.workspace = true
