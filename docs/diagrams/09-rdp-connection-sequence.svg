<text x="36" y="49" font-size="24" fill="#0f172a" font-weight="700">RDP connection sequence</text>
<text x="36" y="79" font-size="14" fill="#475569">Trust before credentials; TLS/NLA on modern servers, legacy TLS or Standard RDP Security on old ones</text>
