<g font-size="13" fill="#0f172a" text-anchor="middle">
<text x="276" y="258">open RDP tab • report desktop size</text>
<text x="276" y="276">first connect uses that size</text>
<text x="518" y="357">connect(session, size)</text>
<text x="1002" y="429">TCP connect</text>
<text x="1002" y="493">X.224 Connection Request • PROTOCOL_SSL | HYBRID | HYBRID_EX</text>
<text x="1002" y="557">Connection Confirm</text>
<text x="881" y="695">start TLS (rustls)</text>
<text x="1244" y="738">TLS handshake</text><text x="1244" y="756">capture the leaf certificate</text>
<text x="397" y="825">trust prompt • certificate fingerprint</text>
<text x="397" y="885">accept trust</text>
<text x="1244" y="953">CredSSP / NLA (NTLM) • password</text>
<text x="881" y="1160">“Allow legacy TLS” → OpenSSL TLS 1.0</text>
<text x="1244" y="1201">TLS 1.0 handshake</text><text x="1244" y="1219">capture the leaf certificate</text>
<text x="397" y="1276">trust prompt • certificate fingerprint</text>
<text x="397" y="1334">accept trust</text>
<text x="1244" y="1392">then CredSSP / NLA (NTLM) • password</text>
<text x="1002" y="1504">reconnect • X.224 requests PROTOCOL_RDP</text>
<text x="1002" y="1562">server RSA key • Standard RDP Security</text>
<text x="397" y="1620">trust prompt • server RSA key fingerprint</text>
<text x="397" y="1678">accept trust</text>
<text x="1002" y="1736">Standard RDP Security • RSA key exchange + RC4; then credentials</text>
<text x="760" y="1893">drive IronRDP connector</text><text x="760" y="1911">over the negotiated transport</text>
<text x="1123" y="1976">MCS Connect Initial (GCC)</text>
<text x="1123" y="2034">MCS Connect Response (GCC)</text>
<text x="1123" y="2180">Licensing exchange</text>
<text x="1123" y="2244">Server Demand Active</text>
<text x="1123" y="2308">Client Confirm Active • connection finalization</text>
<text x="1002" y="2450">server fast-path + slow-path • graphics / pointer updates</text>
<text x="1002" y="2600">client fast-path input • latest pointer per frame</text>
<text x="1002" y="2663">Resize: display control on modern servers</text>
<text x="1002" y="2681">Old servers: reconnect at the new desktop size</text>
<text x="1002" y="2790">Logout • Server Deactivate All</text>
<text x="518" y="2848">session ends cleanly</text>
<text x="276" y="2906">tab disconnected • no error</text>
</g>
