<rect x="78" y="1446" width="1125" height="32" rx="6" fill="#fff7ed"/>
<text x="84" y="1468" font-size="14" fill="#0f172a" font-weight="700">OR • Security Layer = RDP (refusal) + “Allow legacy RDP security” enabled</text>
<rect x="40" y="1841" width="570" height="32" rx="6" fill="#ecfeff"/>
<text x="46" y="1863" font-size="17" fill="#0f172a" font-weight="700">Common connection setup • branches rejoin</text>
<rect x="78" y="2390" width="405" height="32" rx="6" fill="#fdf2f8"/>
<text x="84" y="2412" font-size="17" fill="#0f172a" font-weight="700">LOOP • Active desktop session</text>

<!-- Trust gate note: no credential transmission before acceptance. -->
<rect x="704" y="800" width="810" height="117" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="722" y="829" font-size="17" fill="#0f172a" font-weight="700">Trust before credentials • applies to both alternatives</text>
<text x="722" y="858" font-size="14" fill="#0f172a">Certificate fingerprint (TLS) or server RSA key (Standard RDP Security).</text>
<text x="722" y="879" font-size="14" fill="#0f172a">No credential is sent until accepted; rejection stops the connection.</text>
<text x="722" y="900" font-size="14" fill="#0f172a">Trust events and acceptance travel through Engine.</text>
<!-- Notes in the common and active phases. -->
<rect x="704" y="2080" width="810" height="73" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
<text x="722" y="2109" font-size="17" fill="#0f172a" font-weight="700">Old-server GCC compatibility</text>
<text x="722" y="2138" font-size="14" fill="#0f172a">No RDP 8 message channel / auto-detect on old servers.</text>
<rect x="704" y="2490" width="810" height="82" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
<text x="722" y="2519" font-size="17" fill="#0f172a" font-weight="700">Graphics normalization</text>
<text x="722" y="2548" font-size="14" fill="#0f172a">Split batched Share Control PDUs; de-shear padded-width bitmaps.</text>

