<rect x="40" y="655" width="460" height="30" rx="6" fill="#f0fdf4"/>
<text x="46" y="676" font-size="14" fill="#0f172a">Connection Confirm: selected = HYBRID</text>
<rect x="40" y="1045" width="265" height="32" rx="6" fill="#fff7ed"/>
<text x="46" y="1067" font-size="17" fill="#0f172a" font-weight="700">ALT B • Old server</text>
<rect x="40" y="1080" width="1050" height="28" rx="6" fill="#fff7ed"/>
<text x="46" y="1100" font-size="14" fill="#0f172a">Selected = TLS only, or X.224 refusal SSL_NOT_ALLOWED_BY_SERVER • explicit opt-in fallbacks below</text>
<rect x="78" y="1115" width="655" height="28" rx="6" fill="#fff7ed"/>
<text x="84" y="1135" font-size="14" fill="#0f172a" font-weight="700">TLS path • if the server only offers TLS 1.0/1.1</text>
