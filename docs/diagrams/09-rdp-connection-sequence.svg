<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3010" viewBox="0 0 1600 3010" font-family="Noto Sans, DejaVu Sans, Liberation Sans, Arial, sans-serif">
<title>RDP connection sequence</title>
<desc>Trust gates precede credentials. Modern TLS and NLA, opt-in legacy TLS or Standard RDP Security, common connector setup, active desktop traffic, and clean logout.</desc>
