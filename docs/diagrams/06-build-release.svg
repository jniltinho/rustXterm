<text x="36" y="49" font-size="24" fill="#0f172a" text-anchor="start" font-weight="700">Build and release pipeline</text>
<text x="36" y="79" font-size="14" fill="#475569" text-anchor="start">Docker-only builds; binaries are published only from version tags</text>
<rect x="36" y="188" width="252" height="166" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="54" y="217" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Developer</text>
<text x="54" y="246" font-size="14" fill="#0f172a" text-anchor="start">scripts/cargo-docker.sh</text>
<text x="54" y="267.0" font-size="14" fill="#0f172a" text-anchor="start">All cargo commands run in</text>
<text x="54" y="288.0" font-size="14" fill="#0f172a" text-anchor="start">the pinned toolchain</text>
<text x="54" y="309.0" font-size="14" fill="#0f172a" text-anchor="start">image; no toolchain on</text>
<text x="54" y="330.0" font-size="14" fill="#0f172a" text-anchor="start">the desktop.</text>
<rect x="356" y="188" width="315" height="103" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
<text x="374" y="217" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">1 • Base image</text>
<text x="374" y="246" font-size="14" fill="#0f172a" text-anchor="start">Pinned Ubuntu 24.04 digest +</text>
<text x="374" y="267.0" font-size="14" fill="#0f172a" text-anchor="start">snapshot apt</text>
<rect x="709" y="188" width="315" height="103" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="727" y="217" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">2 • Toolchain</text>
<text x="727" y="246" font-size="14" fill="#0f172a" text-anchor="start">Pinned Rust 1.99 + zig +</text>
<text x="727" y="267.0" font-size="14" fill="#0f172a" text-anchor="start">cargo-zigbuild</text>
<rect x="709" y="339" width="315" height="121" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
<text x="727" y="368" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700" font-family="DejaVu Sans Mono, monospace">3 • Dependency fetch</text>
<text x="727" y="397" font-size="13" fill="#0f172a" text-anchor="start" font-family="DejaVu Sans Mono, monospace">cargo fetch --locked</text>
<text x="727" y="416.5" font-size="13" fill="#0f172a" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Only networked stage</text>
<rect x="356" y="339" width="315" height="121" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="374" y="368" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700" font-family="DejaVu Sans Mono, monospace">4 • Offline build</text>
<text x="374" y="397" font-size="13" fill="#0f172a" text-anchor="start" font-family="DejaVu Sans Mono, monospace">--network=none</text>
<text x="374" y="416.5" font-size="13" fill="#0f172a" text-anchor="start" font-family="DejaVu Sans Mono, monospace">cargo zigbuild --target</text>
<text x="374" y="436.0" font-size="13" fill="#0f172a" text-anchor="start" font-family="DejaVu Sans Mono, monospace">x86_64-unknown-linux-gnu.2.31</text>
<rect x="356" y="508" width="315" height="54" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
<text x="374" y="537" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">5 • AppImage stage</text>
<rect x="709" y="508" width="315" height="54" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="727" y="537" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">6 • dist stage</text>
<rect x="348" y="134" width="248.64999999999998" height="32" rx="6" fill="#eff6ff" stroke="#eff6ff" stroke-width="0"/>
<text x="354" y="156" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Multi-stage Dockerfile</text>
<rect x="1102" y="188" width="262" height="253" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="1120" y="217" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">dist artifacts</text>
<text x="1120" y="246" font-size="13" fill="#0f172a" text-anchor="start">rustxterm-X.Y.Z-x86_64</text>
<text x="1120" y="265.5" font-size="13" fill="#0f172a" text-anchor="start">(portable binary)</text>
<text x="1120" y="290.0" font-size="13" fill="#0f172a" text-anchor="start">.AppImage</text>
<text x="1120" y="314.5" font-size="13" fill="#0f172a" text-anchor="start">.tar.gz: binary, .desktop,</text>
<text x="1120" y="334.0" font-size="13" fill="#0f172a" text-anchor="start">icon, LICENSE,</text>
<text x="1120" y="353.5" font-size="13" fill="#0f172a" text-anchor="start">ATTRIBUTION.md,</text>
<text x="1120" y="373.0" font-size="13" fill="#0f172a" text-anchor="start">THIRD-PARTY-NOTICES.txt,</text>
<text x="1120" y="392.5" font-size="13" fill="#0f172a" text-anchor="start">README.txt</text>
<text x="1120" y="417.0" font-size="13" fill="#0f172a" text-anchor="start">SHA256SUMS</text>
<rect x="36" y="664" width="646" height="134" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="54" y="693" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700" font-family="DejaVu Sans Mono, monospace">cargo xtask dist-check</text>
<text x="54" y="722" font-size="14" fill="#0f172a" text-anchor="start" font-family="DejaVu Sans Mono, monospace">glibc ≤ 2.31 (objdump -T); allowed NEEDED libs; stripped</text>
<text x="54" y="748.0" font-size="14" fill="#0f172a" text-anchor="start" font-family="DejaVu Sans Mono, monospace">--self-test of portable binary and AppImage</text>
<text x="54" y="774.0" font-size="14" fill="#0f172a" text-anchor="start" font-family="DejaVu Sans Mono, monospace">SHA256SUMS; guard over tarball &amp; AppImage</text>
<rect x="720" y="664" width="644" height="134" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
<text x="738" y="693" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700" font-family="DejaVu Sans Mono, monospace">scripts/distro-matrix.sh</text>
<text x="738" y="722" font-size="14" fill="#0f172a" text-anchor="start" font-family="DejaVu Sans Mono, monospace">--self-test: Ubuntu 20.04 / 22.04 / 24.04 / 26.04; Debian 12 / 13;</text>
<text x="738" y="743.0" font-size="14" fill="#0f172a" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Fedora; Arch</text>
<text x="738" y="769.0" font-size="14" fill="#0f172a" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Xvfb GUI smoke: Ubuntu 24.04 / 26.04</text>
<rect x="56" y="916" width="166" height="82" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
<text x="74" y="945" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">fmt</text>
<rect x="240" y="916" width="166" height="82" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="258" y="945" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">clippy</text>
<text x="258" y="974" font-size="13" fill="#0f172a" text-anchor="start">-D warnings</text>
<rect x="424" y="916" width="166" height="82" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
<text x="442" y="945" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">tests</text>
<text x="442" y="974" font-size="13" fill="#0f172a" text-anchor="start">+ UI snapshots</text>
<rect x="608" y="916" width="166" height="82" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="626" y="945" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">xtask layers</text>
<rect x="792" y="916" width="166" height="82" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
<text x="810" y="945" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">xtask guard</text>
<text x="810" y="974" font-size="13" fill="#0f172a" text-anchor="start">--ci</text>
<rect x="976" y="916" width="166" height="82" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
<text x="994" y="945" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">xtask</text>
<text x="994" y="968" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">scenarios</text>
<rect x="1160" y="916" width="166" height="82" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="1178" y="945" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">cargo deny</text>
<rect x="56" y="1030" width="1288" height="82" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
<text x="74" y="1059" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Parallel job: lab</text>
<text x="74" y="1088" font-size="14" fill="#0f172a" text-anchor="start">lab.sh up → lab.sh test; executed names must equal lab/expected-tests.txt</text>
<rect x="48" y="860" width="570.8" height="32" rx="6" fill="#eff6ff" stroke="#eff6ff" stroke-width="0"/>
<text x="54" y="882" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">GitHub Actions • ci.yml • push to main / pull requests</text>
<rect x="56" y="1238" width="188" height="102" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="74" y="1267" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">Reuse ci.yml</text>
<text x="74" y="1296" font-size="13" fill="#0f172a" text-anchor="start">All checks + lab</text>
<rect x="272" y="1238" width="188" height="102" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
<text x="290" y="1267" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">Version gate</text>
<text x="290" y="1296" font-size="13" fill="#0f172a" text-anchor="start">tag == workspace</text>
<text x="290" y="1315.5" font-size="13" fill="#0f172a" text-anchor="start">version</text>
<rect x="488" y="1238" width="188" height="102" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="506" y="1267" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">Docker dist</text>
<text x="506" y="1296" font-size="13" fill="#0f172a" text-anchor="start">docker build</text>
<text x="506" y="1315.5" font-size="13" fill="#0f172a" text-anchor="start">--target dist</text>
<rect x="704" y="1238" width="188" height="102" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="722" y="1267" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">dist-check</text>
<rect x="920" y="1238" width="188" height="102" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
<text x="938" y="1267" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">Distro matrix</text>
<rect x="1136" y="1238" width="188" height="102" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
<text x="1154" y="1267" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">Publish release</text>
<text x="1154" y="1296" font-size="13" fill="#0f172a" text-anchor="start">gh release create</text>
<text x="56" y="1380" font-size="14" fill="#475569" text-anchor="start">Tags with a &quot;-&quot; suffix are pre-releases.</text>
<rect x="48" y="1182" width="448.4" height="32" rx="6" fill="#fff7ed" stroke="#fff7ed" stroke-width="0"/>
<text x="54" y="1204" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">GitHub Actions • release.yml • tags v*.*.*</text>
<rect x="36" y="1446" width="1328" height="82" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
<text x="54" y="1475" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Local pre-push • cargo xtask guard</text>
<text x="54" y="1504" font-size="14" fill="#0f172a" text-anchor="start">Forbidden-digest check of local-only material, home paths, and attribution.</text>
<rect x="690.4" y="603" width="211.2" height="30" rx="15" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
<text x="796" y="622" font-size="13" fill="#0f172a" text-anchor="middle">verify before publishing</text>
</svg>
