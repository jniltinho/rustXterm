# Implicit FTPS on port 990 (TLS from the first byte).
listen=YES
listen_ipv6=NO
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
seccomp_sandbox=NO
pam_service_name=vsftpd
pasv_enable=YES
pasv_address=127.0.0.1
pasv_min_port=30010
pasv_max_port=30019
ssl_enable=YES
force_local_logins_ssl=YES
force_local_data_ssl=YES
require_ssl_reuse=NO
rsa_cert_file=/etc/ssl/private/lab-ftp.pem
rsa_private_key_file=/etc/ssl/private/lab-ftp.pem
implicit_ssl=YES
listen_port=990
