[package]
name = "rustxterm"
description = "rustXterm: native terminal and remote session manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Windows builds two executables from the same code (add-windows-port design W5):
# `rustxterm.exe` (GUI subsystem, set in build.rs) and `rustxterm-cli.exe` (console).
[[bin]]
name = "rustxterm"
path = "src/main.rs"

[[bin]]
name = "rustxterm-cli"
path = "src/bin/rustxterm-cli.rs"

[dependencies]
rxt-core.workspace = true
rxt-platform.workspace = true
rxt-engine.workspace = true
rxt-ui.workspace = true
rxt-store.workspace = true
rxt-term.workspace = true
rxt-agent.workspace = true
eframe.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rxt-platform-linux.workspace = true

[target.'cfg(windows)'.dependencies]
rxt-platform-windows.workspace = true

[dev-dependencies]
secrecy.workspace = true
serde_json.workspace = true

[lints]
workspace = true
