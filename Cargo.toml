[workspace]
members = [
    "apps/rustxterm",
    "crates/core",
    "crates/platform",
    "crates/platform-linux",
    "crates/platform-windows",
    "crates/platform-macos",
    "crates/store",
    "crates/term",
    "crates/ssh",
    "crates/sftp",
    "crates/ftp",
    "crates/rdp",
    "crates/vnc",
    "crates/telnet",
    "crates/serial",
    "crates/engine",
    "crates/agent",
    "crates/ui",
    "xtask",
]
# Vendored third-party crates keep their own lints; see vendor/README.md.
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/jniltinho/rustXterm"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.dependencies]
# internal
rxt-core = { path = "crates/core" }
rxt-platform = { path = "crates/platform" }
rxt-platform-linux = { path = "crates/platform-linux" }
rxt-platform-windows = { path = "crates/platform-windows" }
rxt-platform-macos = { path = "crates/platform-macos" }
rxt-store = { path = "crates/store" }
rxt-term = { path = "crates/term" }
rxt-ssh = { path = "crates/ssh" }
rxt-sftp = { path = "crates/sftp" }
rxt-ftp = { path = "crates/ftp" }
rxt-rdp = { path = "crates/rdp" }
rxt-vnc = { path = "crates/vnc" }
rxt-telnet = { path = "crates/telnet" }
rxt-serial = { path = "crates/serial" }
rxt-engine = { path = "crates/engine" }
rxt-agent = { path = "crates/agent" }
rxt-ui = { path = "crates/ui" }

# common
thiserror = "=2.0.21"
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.1.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
bytes = "=1.12.1"
parking_lot = "=0.12.5"
rand = "=0.10.3"
sha2 = "=0.11.1"
# MSI summary-info normalization for reproducible Windows packages (xtask msi-normalize).
msi = "=0.10.0"
uuid = "=1.28.0"
hmac = "=0.13.0"
sha1 = "=0.11.0"
# Standard RDP Security (crates/rdp/src/legacy.rs); all already in the lockfile.
md-5 = "=0.11.0"
num-bigint = "=0.4.8"
pkcs1 = "=0.7.5"
base64 = "=0.23.1"
data-encoding = "=2.11.1"
regex = "=1.13.1"
secrecy = "=0.10.3"
zeroize = "=1.9.1"
clap = { version = "=4.6.7", features = ["derive"] }
rpassword = "=7.5.4"

# ui
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit", "default_fonts", "persistence"] }
egui = "=0.36.2"
egui_extras = { version = "=0.36.2", features = ["image", "svg"] }
egui_kittest = { version = "=0.36.2", features = ["wgpu", "snapshot"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

# terminal
alacritty_terminal = "=0.26.0"

# protocols
russh = { version = "=0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "=3.0.1"
suppaftp = { version = "=12.2.0", features = ["tokio-rustls-ring", "deprecated", "no-log"] }
# ironrdp 0.17 pins picky =7.0.0-rc.25 (curve25519-dalek =5.0.0-rc.1, conflicting with russh's ^5);
# picky and sspi are vendored with relaxed crypto pins via [patch.crates-io] below (vendor/README.md).
ironrdp = { version = "=0.17.0", features = ["connector", "session", "graphics", "input", "cliprdr", "displaycontrol", "dvc", "svc", "pdu", "core"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
x509-cert = { version = "=0.3.0", default-features = false, features = ["std"] }
# Legacy TLS 1.0/1.1 for old RDP servers (opt-in per session). Same vendored, statically linked
# openssl-sys as rusqlite's SQLCipher: no libssl at runtime (xtask dist-check).
openssl = { version = "=0.10.81", features = ["vendored"] }
tokio-openssl = "=0.6.5"
# RDP test peers only (crates/rdp/tests).
ironrdp-acceptor = "=0.10.0"
ironrdp-tokio = "=0.10.0"
picky = { version = "=7.0.0-rc.25", default-features = false, features = ["x509"] }
vnc-rs = "=0.6.0"

# store / agent / platform
argon2 = "=0.6.0"
chacha20poly1305 = "=0.11.0"
dotenvy = "=0.15.7"
cap-std = "=4.0.3"
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
rmcp = { version = "=3.5.1", features = ["server", "transport-io"] }
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "settings", "file_chooser"] }
oo7 = { version = "=0.6.0", default-features = false, features = ["tokio", "native_crypto"] }
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
notify-rust = "=4.18.2"
dirs = "=7.0.0"
# Serial ports (platform-linux only). No default features: no libudev C library (design S1). MPL-2.0.
serialport = { version = "=4.10.1", default-features = false }
# macOS-only (Keychain, safe API).
security-framework = "=2.11.1"
portable-pty = "=0.9.0"
nix = { version = "=0.28.0", default-features = false, features = ["signal"] }

[patch.crates-io]
picky = { path = "vendor/picky" }
sspi = { path = "vendor/sspi" }
# vnc-rs 0.6.0 + mid-message stall timeout and bounded network buffer (design D13).
vnc-rs = { path = "vendor/vnc-rs" }
# wgpu-hal 30.0.1 + DX12 keeps the display-owning WARP adapter (GPU-less Windows VMs; vendor/README.md).
wgpu-hal = { path = "vendor/wgpu-hal" }
# ironrdp-connector 0.10.0 / ironrdp-pdu 0.9.0 + opt-in Standard RDP Security (vendor/README.md).
ironrdp-connector = { path = "vendor/ironrdp-connector" }
ironrdp-pdu = { path = "vendor/ironrdp-pdu" }
# ironrdp-session 0.11.0 + split batched Share Control PDUs (Windows 2008 R2); vendor/README.md.
ironrdp-session = { path = "vendor/ironrdp-session" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
# Keeps parallel target dirs small; enough for backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
